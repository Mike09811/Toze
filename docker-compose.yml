services:
  mysql:
    image: mysql:8.0
    container_name: toze-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin123}
      MYSQL_DATABASE: ${DB_NAME:-admin_plus}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:33306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-admin123}"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ./server
    container_name: toze-server
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_ADDR: :8088
      HTTP_STATIC_DIR: ""
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      DB_NAME: ${DB_NAME:-toze}
      DB_AUTO_MIGRATE: "true"
      DB_SEED: "true"
      JWT_SECRET: ${JWT_SECRET:-please-change-this-to-a-32-byte-secret}
      LOG_FORMAT: json
      PAAS_AES_KEY: ${PAAS_AES_KEY:-}
      TZ: Asia/Shanghai
    ports:
      - "8088:8088"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ./web
    container_name: toze-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  mysql-data:
